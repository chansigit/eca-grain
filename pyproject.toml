[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eca-grain"   # PyPI distribution name; import name stays `ecagrain`
version = "0.1.0"
description = "GRAIN: Guarded Rigor-Audited In-lineage Neighborhoods. One-pass grains (metacell-style aggregates) from released ECA-RSI units."
readme = "README.md"
license = "MIT"
authors = [{ name = "chansigit", email = "chansigit@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "osp-sc>=0.1.2,<0.2",   # dissociation-stress gene panel (single source of truth in the ecosystem)
    "scanpy>=1.10",
    "anndata>=0.10",
    "numpy>=1.24",
    "scipy>=1.9",
    "pandas>=2.0",
    "pyarrow",              # membership.parquet
    "h5py",
    "igraph>=0.10",         # walktrap
    "leidenalg",            # report-page clustering of grains
    "umap-learn",
    "scikit-learn>=1.2",
    "statsmodels",          # lowess trends (own vst HVG, mcRigor threshold)
    "shapely>=2.0",         # concave-hull lineage islands on the report page
    "matplotlib>=3.7",
]

[project.scripts]
eca-grain = "ecagrain.__main__:main"

[project.urls]
Homepage = "https://github.com/chansigit/eca-grain"

[tool.setuptools]
packages = ["ecagrain"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF100"]
ignore = ["E501", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
